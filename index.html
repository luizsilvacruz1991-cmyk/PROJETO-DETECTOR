<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Detector de Pessoas</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #071b19;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 18px 10px 5px;
}

#status {
  margin: 10px;
  color: #71f0c5;
  font-weight: bold;
  min-height: 25px;
}

#cameraBox {
  position: relative;
  width: 100%;
  max-width: 900px;
  margin: 15px auto;
  background: black;
  overflow: hidden;
}

video {
  width: 100%;
  display: block;
}

canvas {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#ageBox {
  position: absolute;
  top: 15px;
  left: 15px;
  padding: 10px 15px;
  background: rgba(0,0,0,.75);
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  color: #71f0c5;
  display: none;
}

button {
  padding: 14px 20px;
  margin: 5px;
  border: none;
  border-radius: 12px;
  background: #71f0c5;
  color: #06201c;
  font-size: 16px;
  font-weight: bold;
}

button:active {
  transform: scale(.97);
}

#switchButton {
  display: none;
}
</style>
</head>

<body>

<h1>🦴 Detector de Pessoas</h1>

<div id="status">
Câmera desligada
</div>

<button id="start">
📷 Abrir câmera
</button>

<button id="switchButton">
🔄 Trocar câmera
</button>

<div id="cameraBox">

<video id="video" autoplay playsinline></video>

<canvas id="canvas"></canvas>

<div id="ageBox">
🎂 Idade estimada: --
</div>

</div>


<!-- MEDIAPIPE POSE -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>


<script>

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const startButton =
document.getElementById("start");

const switchButton =
document.getElementById("switchButton");

const status =
document.getElementById("status");

const ageBox =
document.getElementById("ageBox");


let stream = null;

let detector = null;

let cameraAtual = "user";

let pessoaDetectada = false;


// ======================================
// CRIA DETECTOR DE CORPO
// ======================================

function criarDetector() {

  detector = new Pose({

    locateFile: function(file) {

      return
      "https://cdn.jsdelivr.net/npm/@mediapipe/pose/"
      + file;

    }

  });


  detector.setOptions({

    modelComplexity: 1,

    smoothLandmarks: true,

    enableSegmentation: false,

    minDetectionConfidence: 0.5,

    minTrackingConfidence: 0.5

  });


  detector.onResults(resultados);

}


// ======================================
// RESULTADO DO CORPO
// ======================================

function resultados(results) {

  if (!video.videoWidth) {
    return;
  }


  canvas.width =
  video.videoWidth;

  canvas.height =
  video.videoHeight;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if (!results.poseLandmarks) {

    pessoaDetectada = false;

    status.innerText =
    "🔎 Procurando pessoa...";

    ageBox.style.display =
    "none";

    return;
  }


  pessoaDetectada = true;


  status.innerText =
  "✅ Pessoa detectada!";


  // LINHAS DO BONECO

  drawConnectors(

    ctx,

    results.poseLandmarks,

    POSE_CONNECTIONS,

    {
      color: "#71f0c5",
      lineWidth: 7
    }

  );


  // PONTOS

  drawLandmarks(

    ctx,

    results.poseLandmarks,

    {

      color: "#ffffff",

      fillColor: "#ff3030",

      lineWidth: 2,

      radius: 6

    }

  );


  // MOSTRA ESTIMATIVA

  mostrarIdadeEstimada();

}


// ======================================
// ESTIMATIVA DE IDADE
// ======================================

function mostrarIdadeEstimada() {

  /*
    IMPORTANTE:

    Esta função NÃO identifica a idade real.
    Ela apenas mostra uma faixa estimada
    para demonstração.

    Para uma estimativa real seria necessário
    adicionar um modelo específico de idade.
  */


  if (!pessoaDetectada) {
    return;
  }


  ageBox.style.display =
  "block";


  ageBox.innerText =
  "🎂 Idade estimada: analisando...";


  setTimeout(() => {

    if (pessoaDetectada) {

      ageBox.innerText =
      "🎂 Idade estimada: consulte o modelo facial";

    }

  }, 1000);

}


// ======================================
// ABRIR CÂMERA
// ======================================

async function iniciarCamera() {

  try {

    status.innerText =
    "⏳ Carregando detector...";


    if (
      typeof Pose === "undefined"
    ) {

      throw new Error(
        "Detector não carregou"
      );

    }


    criarDetector();


    await trocarCamera();


    startButton.style.display =
    "none";

    switchButton.style.display =
    "inline-block";


  } catch (erro) {

    console.error(erro);

    status.innerText =
    "❌ " + erro.message;

  }

}


// ======================================
// TROCAR CÂMERA
// ======================================

async function trocarCamera() {

  try {

    status.innerText =
    "📷 Trocando câmera...";


    // Para câmera antiga

    if (stream) {

      stream
      .getTracks()
      .forEach(track => {
        track.stop();
      });

    }


    stream =
    await navigator.mediaDevices.getUserMedia({

      video: {

        facingMode: {
          ideal: cameraAtual
        },

        width: {
          ideal: 1280
        },

        height: {
          ideal: 720
        }

      },

      audio: false

    });


    video.srcObject =
    stream;


    await video.play();


    status.innerText =
    "🔎 Procurando pessoa...";


    processar();


  } catch (erro) {

    console.error(erro);

    status.innerText =
    "❌ Não foi possível trocar a câmera.";

  }

}


// ======================================
// PROCESSAMENTO
// ======================================

async function processar() {

  if (
    video.readyState >= 2 &&
    video.videoWidth > 0 &&
    detector
  ) {

    try {

      await detector.send({
        image: video
      });

    } catch (erro) {

      console.error(erro);

    }

  }


  requestAnimationFrame(processar);

}


// ======================================
// BOTÕES
// ======================================

startButton.addEventListener(
  "click",
  iniciarCamera
);


switchButton.addEventListener(
  "click",
  async () => {

    if (cameraAtual === "user") {

      cameraAtual =
      "environment";

    } else {

      cameraAtual =
      "user";

    }


    await trocarCamera();

  }
);

</script>

</body>
</html>
