<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Detector de Pessoas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #071b19;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 20px 10px 10px;
    }

    #status {
      margin: 10px;
      color: #71f0c5;
      min-height: 24px;
    }

    .camera-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 20px auto;
      background: black;
      overflow: hidden;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 16px 25px;
      background: #71f0c5;
      color: #06201c;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <h1>🦴 Detector de Pessoas</h1>

  <div id="status">
    Câmera desligada
  </div>

  <button id="startButton">
    📷 Abrir câmera
  </button>

  <div class="camera-container">

    <video id="camera" autoplay playsinline></video>

    <canvas id="canvas"></canvas>

  </div>

  <!-- MediaPipe Pose -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

  <!-- Desenho do esqueleto -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <script>

    const video = document.getElementById("camera");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const button = document.getElementById("startButton");
    const status = document.getElementById("status");

    let cameraStream = null;

    // ==========================================
    // CONFIGURAÇÃO DO DETECTOR
    // ==========================================

    const pose = new Pose({
      locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
      }
    });

    pose.setOptions({

      modelComplexity: 1,

      smoothLandmarks: true,

      enableSegmentation: false,

      smoothSegmentation: true,

      minDetectionConfidence: 0.5,

      minTrackingConfidence: 0.5

    });

    // ==========================================
    // RESULTADO DA DETECÇÃO
    // ==========================================

    pose.onResults((results) => {

      if (!video.videoWidth || !video.videoHeight) {
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      // Verifica se encontrou uma pessoa
      if (!results.poseLandmarks) {

        status.textContent =
          "🔍 Procurando uma pessoa...";

        return;
      }

      status.textContent =
        "✅ Pessoa detectada!";

      // ==========================================
      // DESENHA O BONECO DE PALITO
      // ==========================================

      drawConnectors(
        ctx,
        results.poseLandmarks,
        POSE_CONNECTIONS,
        {
          color: "#71f0c5",
          lineWidth: 6
        }
      );

      // ==========================================
      // DESENHA OS PONTOS DO CORPO
      // ==========================================

      drawLandmarks(
        ctx,
        results.poseLandmarks,
        {
          color: "#ffffff",
          fillColor: "#71f0c5",
          lineWidth: 2,
          radius: 5
        }
      );

    });

    // ==========================================
    // ABRIR CÂMERA
    // ==========================================

    async function abrirCamera() {

      try {

        status.textContent =
          "📷 Solicitando acesso à câmera...";

        cameraStream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: "environment",

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              }
            },

            audio: false

          });

        video.srcObject = cameraStream;

        await video.play();

        status.textContent =
          "🔍 Iniciando detector...";

        button.style.display = "none";

        detectar();

      } catch (erro) {

        console.error(erro);

        status.textContent =
          "❌ Não foi possível acessar a câmera.";

        alert(
          "Não consegui acessar a câmera. " +
          "Verifique se você permitiu o acesso à câmera."
        );

      }

    }

    // ==========================================
    // PROCESSA A CÂMERA
    // ==========================================

    async function detectar() {

      if (
        video.readyState >= 2 &&
        video.videoWidth > 0
      ) {

        await pose.send({
          image: video
        });

      }

      requestAnimationFrame(detectar);

    }

    button.addEventListener(
      "click",
      abrirCamera
    );

  </script>

</body>
</html>
