<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Human Pose & Age Detector</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg-color: #050b10;
  --card-bg: rgba(13, 27, 38, 0.65);
  --accent-cyan: #00f2fe;
  --accent-green: #00ff88;
  --accent-red: #ff3366;
  --text-main: #e2f1f8;
  --text-dim: #7a92a5;
  --border-glow: rgba(0, 242, 254, 0.25);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg-color);
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.08) 0%, transparent 60%),
    radial-gradient(circle at 80% 100%, rgba(0, 255, 136, 0.05) 0%, transparent 50%);
  color: var(--text-main);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px;
}

header {
  margin-bottom: 10px;
  text-align: center;
}

h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.8rem;
  font-weight: 900;
  letter-spacing: 2px;
  background: linear-gradient(135deg, #ffffff 0%, var(--accent-cyan) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.subtitle {
  font-size: 0.85rem;
  color: var(--text-dim);
}

.dashboard-bar {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
  width: 100%;
}

.status-badge {
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-glow);
  padding: 8px 18px;
  border-radius: 50px;
  font-size: 0.9rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

.status-indicator {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent-red);
  box-shadow: 0 0 10px var(--accent-red);
  transition: all 0.3s ease;
}

.status-badge.active .status-indicator {
  background: var(--accent-green);
  box-shadow: 0 0 12px var(--accent-green);
}

#cameraBox {
  position: relative;
  width: 100%;
  max-width: 1200px;
  height: 72vh;
  max-height: 800px;
  background: #020608;
  border-radius: 20px;
  overflow: hidden;
  border: 2px solid var(--border-glow);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 242, 254, 0.15);
}

#cameraBox::before, #cameraBox::after {
  content: '';
  position: absolute;
  width: 25px;
  height: 25px;
  border: 3px solid var(--accent-cyan);
  z-index: 10;
  pointer-events: none;
  opacity: 0.7;
}
#cameraBox::before { top: 15px; left: 15px; border-right: 0; border-bottom: 0; }
#cameraBox::after { bottom: 15px; right: 15px; border-left: 0; border-top: 0; }

video, canvas {
  width: 100%;
  height: 100%;
  object-fit: contain;
  position: absolute;
  top: 0;
  left: 0;
  transform: scaleX(-1);
}

.controls {
  margin-top: 14px;
}

button {
  font-family: 'Orbitron', sans-serif;
  padding: 14px 32px;
  border: none;
  border-radius: 50px;
  background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
  color: #030f17;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 35px rgba(0, 242, 254, 0.7);
}

button.stop {
  background: linear-gradient(135deg, #ff3366 0%, #ff6b81 100%);
  color: #ffffff;
  box-shadow: 0 0 25px rgba(255, 51, 102, 0.4);
}

@media (max-width: 600px) {
  #cameraBox { height: 60vh; }
}
</style>
</head>

<body>

<header>
  <h1>Detector Corporal & Idade IA</h1>
  <p class="subtitle">Análise biomecânica e estimativa biométrica em tempo real</p>
</header>

<div class="dashboard-bar">
  <div class="status-badge" id="statusBadge">
    <span class="status-indicator" id="statusIndicator"></span>
    <span id="statusText">Sistema em Espera</span>
  </div>
</div>

<div id="cameraBox">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<div class="controls">
  <button id="toggleBtn">INICIAR CÂMERA</button>
</div>

<!-- BIBLIOTECAS MEDIAPIPE -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const toggleBtn = document.getElementById("toggleBtn");
const statusBadge = document.getElementById("statusBadge");
const statusText = document.getElementById("statusText");

let detector = null;
let stream = null;
let isRunning = false;
let animationFrameId = null;

// Cache da estimativa de idade para evitar oscilações na tela
let idadeEstimadaCache = null;
let contagemFrames = 0;

function criarDetector() {
  if (detector) return detector;

  detector = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  detector.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    enableSegmentation: false,
    smoothSegmentation: false,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  detector.onResults(desenharResultados);
  return detector;
}

// Algoritmo Biométrico de Estimativa de Idade
function estimarIdade(landmarks) {
  // Landmarks faciais do MediaPipe Pose
  const nariz = landmarks[0];
  const olhoEsq = landmarks[2];
  const olhoDir = landmarks[5];
  const orelhaEsq = landmarks[7];
  const orelhaDir = landmarks[8];
  const ombroEsq = landmarks[11];
  const ombroDir = landmarks[12];

  // Cálculo da distância interocular
  const distOlhos = Math.hypot(olhoDir.x - olhoEsq.x, olhoDir.y - olhoEsq.y);
  // Largura dos ombros
  const larguraOmbros = Math.hypot(ombroDir.x - ombroEsq.x, ombroDir.y - ombroEsq.y);

  // Proporção Cabeça / Ombro (Crianças têm cabeça proporcionalmente maior em relação aos ombros)
  const proporcaoCabecaOmbro = distOlhos / (larguraOmbros || 0.3);

  // Variação de amostragem biométrica
  contagemFrames++;
  if (!idadeEstimadaCache || contagemFrames % 30 === 0) {
    if (proporcaoCabecaOmbro > 0.38) {
      idadeEstimadaCache = "8 - 14 anos";
    } else if (proporcaoCabecaOmbro > 0.28) {
      idadeEstimadaCache = "18 - 28 anos";
    } else if (proporcaoCabecaOmbro > 0.22) {
      idadeEstimadaCache = "29 - 42 anos";
    } else {
      idadeEstimadaCache = "45+ anos";
    }
  }

  return idadeEstimadaCache;
}

function desenharResultados(results) {
  if (!isRunning || !video.videoWidth) return;

  if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!results.poseLandmarks) {
    statusBadge.classList.remove("active");
    statusText.innerText = "Procurando pessoa...";
    return;
  }

  statusBadge.classList.add("active");
  statusText.innerText = "PESSOA DETECTADA";

  const landmarks = results.poseLandmarks;

  // 1. Desenhar conexões da estrutura óssea
  drawConnectors(ctx, landmarks, POSE_CONNECTIONS, {
    color: "#00f2fe",
    lineWidth: 4
  });

  // 2. Desenhar pontos anatômicos
  drawLandmarks(ctx, landmarks, {
    color: "#ffffff",
    fillColor: "#00ff88",
    lineWidth: 2,
    radius: 5
  });

  // 3. Projetar a caixa/HUD com a estimativa de idade acima do nariz/cabeça
  const nariz = landmarks[0];
  if (nariz && nariz.visibility > 0.5) {
    const ageText = estimarIdade(landmarks);

    const x = nariz.x * canvas.width;
    const y = (nariz.y * canvas.height) - 70; // Posição flutuante acima do rosto

    ctx.save();
    
    // Desenho do Card Holográfico (HUD)
    ctx.fillStyle = "rgba(5, 18, 28, 0.85)";
    ctx.strokeStyle = "#00f2fe";
    ctx.lineWidth = 2;
    
    const cardWidth = 160;
    const cardHeight = 45;
    const cardX = x - (cardWidth / 2);
    const cardY = y;

    // Retângulo do Badge
    ctx.beginPath();
    ctx.roundRect(cardX, cardY, cardWidth, cardHeight, 10);
    ctx.fill();
    ctx.stroke();

    // Inverter texto para legibilidade (devido ao scaleX(-1) do CSS)
    ctx.translate(x, cardY + 22);
    ctx.scale(-1, 1);

    ctx.fillStyle = "#7a92a5";
    ctx.font = "10px Orbitron";
    ctx.textAlign = "center";
    ctx.fillText("ESTIMATIVA DE IDADE", 0, -6);

    ctx.fillStyle = "#00ff88";
    ctx.font = "bold 13px Orbitron";
    ctx.fillText(ageText, 0, 10);

    ctx.restore();
  }
}

async function processar() {
  if (!isRunning) return;

  try {
    if (video.readyState >= 2 && video.videoWidth > 0) {
      await detector.send({ image: video });
    }
  } catch (erro) {
    console.error("Erro no frame:", erro);
  }

  if (isRunning) {
    animationFrameId = requestAnimationFrame(processar);
  }
}

async function iniciar() {
  try {
    statusText.innerText = "Carregando modelo...";

    if (typeof Pose === "undefined") {
      throw new Error("Bibliotecas não carregadas.");
    }

    criarDetector();

    statusText.innerText = "Iniciando câmera...";

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    isRunning = true;
    toggleBtn.innerText = "PARAR CÂMERA";
    toggleBtn.classList.add("stop");
    statusText.innerText = "Procurando pessoa...";

    processar();

  } catch (erro) {
    console.error(erro);
    statusText.innerText = "Erro: " + erro.message;
    parar();
  }
}

function parar() {
  isRunning = false;

  if (animationFrameId) {
    cancelAnimationFrame(animationFrameId);
    animationFrameId = null;
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  toggleBtn.innerText = "INICIAR CÂMERA";
  toggleBtn.classList.remove("stop");
  statusBadge.classList.remove("active");
  statusText.innerText = "Sistema em Espera";
}

toggleBtn.addEventListener("click", () => {
  if (isRunning) {
    parar();
  } else {
    iniciar();
  }
});
</script>

</body>
</html>
