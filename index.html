<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Detector de Pessoa</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #071b19;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 20px 10px 5px;
}

#status {
  margin: 10px;
  color: #71f0c5;
  font-weight: bold;
}

#cameraBox {
  position: relative;
  width: 100%;
  max-width: 900px;
  margin: 20px auto;
  background: black;
  overflow: hidden;
}

video {
  width: 100%;
  display: block;
}

canvas {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
}

button {
  padding: 16px 25px;
  border: none;
  border-radius: 12px;
  background: #71f0c5;
  color: #06201c;
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>🦴 Detector de Pessoa</h1>

<div id="status">
Câmera desligada
</div>

<button id="start">
📷 Abrir câmera
</button>

<div id="cameraBox">

<video id="video" autoplay playsinline></video>

<canvas id="canvas"></canvas>

</div>


<!-- BIBLIOTECAS DO MEDIAPIPE -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>


<script>

const video = document.getElementById("video");

const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d");

const button = document.getElementById("start");

const status = document.getElementById("status");


let detector = null;

let camera = null;


// ==============================
// CRIA O DETECTOR
// ==============================

function criarDetector() {

  detector = new Pose({

    locateFile: function(file) {

      return "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" + file;

    }

  });


  detector.setOptions({

    modelComplexity: 1,

    smoothLandmarks: true,

    enableSegmentation: false,

    smoothSegmentation: false,

    minDetectionConfidence: 0.4,

    minTrackingConfidence: 0.4

  });


  detector.onResults(resultado);

}


// ==============================
// RESULTADO
// ==============================

function resultado(results) {

  if (!video.videoWidth) {
    return;
  }


  canvas.width = video.videoWidth;

  canvas.height = video.videoHeight;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  // NÃO ENCONTROU PESSOA

  if (!results.poseLandmarks) {

    status.innerText =
      "🔎 Procurando pessoa...";

    return;

  }


  // ENCONTROU PESSOA

  status.innerText =
    "✅ PESSOA DETECTADA!";


  // ==============================
  // LINHAS DO BONECO
  // ==============================

  drawConnectors(

    ctx,

    results.poseLandmarks,

    POSE_CONNECTIONS,

    {
      color: "#71f0c5",
      lineWidth: 7
    }

  );


  // ==============================
  // PONTOS DO CORPO
  // ==============================

  drawLandmarks(

    ctx,

    results.poseLandmarks,

    {

      color: "#ffffff",

      fillColor: "#ff3030",

      lineWidth: 2,

      radius: 6

    }

  );

}


// ==============================
// ABRIR CÂMERA
// ==============================

async function iniciar() {

  try {

    status.innerText =
      "⏳ Carregando detector...";


    // Verifica se a biblioteca carregou

    if (typeof Pose === "undefined") {

      throw new Error(
        "Detector não carregou"
      );

    }


    criarDetector();


    status.innerText =
      "📷 Abrindo câmera...";


    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: "user",

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    video.srcObject = stream;


    await video.play();


    button.style.display = "none";


    status.innerText =
      "🔎 Procurando pessoa...";


    // ==============================
    // PROCESSAMENTO
    // ==============================

    async function processar() {

      try {

        if (
          video.readyState >= 2 &&
          video.videoWidth > 0
        ) {

          await detector.send({
            image: video
          });

        }

      } catch (erro) {

        console.error(erro);

        status.innerText =
          "❌ Erro no detector";

      }


      requestAnimationFrame(processar);

    }


    processar();


  } catch (erro) {

    console.error(erro);

    status.innerText =
      "❌ Erro: " + erro.message;

  }

}


button.addEventListener(
  "click",
  iniciar
);

</script>

</body>
</html>
